<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Generar iconos Nido</title></head>
<body>
<h2>Generador de iconos para Nido PWA</h2>
<p>Haz clic en cada botón para descargar el ícono correspondiente.</p>
<canvas id="c"></canvas><br><br>
<button onclick="gen(192)">Descargar icon-192x192.png</button>
<button onclick="gen(512)">Descargar icon-512x512.png</button>
<button onclick="gen(180,'apple-touch-icon')">Descargar apple-touch-icon.png</button>
<script>
const logo = new Image();
logo.src = '../images/nido-logo.png';
logo.onload = () => {
  const preview = document.getElementById('c');
  preview.width = 300; preview.height = 300;
  const ctx = preview.getContext('2d');
  ctx.drawImage(logo, 0, 0, 300, 300);
};

function gen(size, name) {
  const canvas = document.getElementById('c');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(logo, 0, 0, size, size);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = (name || `icon-${size}x${size}`) + '.png';
  a.click();
}
</script>
</body>
</html>
